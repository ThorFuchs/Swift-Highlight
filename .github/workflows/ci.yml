name: CI
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.2.4@sha256:3459518b2e723a7c363d0f8cfa44fc796c77ecd8c18e92fd10e6f92dd78c0b12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: swift --version
      - run: swift build --product SwiftHighlight
      - run: swift build --product SwiftHighlightHTML
      - run: swift test
      - run: swift build -c release
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: swift --version
      - run: swift build
      - run: swift test
      - run: swift build -c release
      - run: xcodebuild -scheme SwiftHighlightApple -destination 'generic/platform=iOS Simulator' build
