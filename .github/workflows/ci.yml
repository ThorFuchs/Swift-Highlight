name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        image:
          - swift:6.2.4@sha256:3459518b2e723a7c363d0f8cfa44fc796c77ecd8c18e92fd10e6f92dd78c0b12
          - swift:6.4@sha256:0384f00cf80f81064a907c249a0ad56a1648906f65075a95b1827e88de666e21
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift build --product SwiftHighlight
      - run: swift build --product SwiftHighlightHTML
      - run: swift test
      - run: swift build -c release
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift build
      - run: swift test
      - run: swift build -c release
      - run: xcodebuild -scheme SwiftHighlightApple -destination 'generic/platform=iOS Simulator' build
      - name: Build all DocC archives
        run: sh Tools/build-docc.sh
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: swift:6.4@sha256:0384f00cf80f81064a907c249a0ad56a1648906f65075a95b1827e88de666e21
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Python for documentation checks
        run: apt-get update && apt-get install -y python3
      - run: python3 Tools/check-documentation-links.py
      - run: python3 -m unittest discover -s Tools -p 'test_*.py'
      - run: sh Tools/build-docc.sh
